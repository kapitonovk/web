# Издержки и выгоды регионализации предприятий водоснабжения и водоотведения

 
.right[Капитонов Кирилл, БГП-212]
---

# Актуальность 
Водоснабжение и водоотведение (ВиВ):

Иммобильно + дорогие сети, которые не продублировать + временна́я и пространственная специфичность &#8658

&#8658 Системы ВиВ — естественные монополии на местном уровне; рынок представлен одной фирмой, а конкурируют фирмы за **право входа на рынок**

> \+  для России характерны проблемы **высокого износа** (&#8594 требуются значительные капиталовложения)

Возможные решения? — Укрупнение водоканалов (формирование региональных / межрегиональных предприятий ВиВ) – Так должна возникать экономия на масштабе &#8658 появляться дополнительные инвестиционные ресурсы

Потенциально решение особенно ценно для нестабильных и уязвимых предприятий. Но достаточно ли такого решения для значимого изменения в лучшую сторону? Не приведет ли формирование супер-предприятий к олигополии без борьбы за право войти на рынок? Возрастут ли другие издержки?

---

# В чем же проблема?
Не очевидно соотношение от выгод экономии на масштабе, характерной для модели регионального управления водоканалами, с возникающими системными издержками 

### Вопрос
> Всегда ли переход к региональной форме управления — наилучший сценарий? Какие **выгоды** и системные **риски** стоят за такой формой управления предприятиями ВиВ? 

### Объект
> Предприятия водоснабжения и водоотведения

### Предмет
> Соотношение издержек, характер системных рисков и выгод, связанных с регионализацией предприятий водоснабжения и водоотведения

# И что же нам делать?

### Цель
> Рассмотреть **баланс издержек и выгод**, возникающих при регионализации управления городскими водоканалами, для определения задаваемых такой моделью системных **рисков** и сценариев, при которых ее использование **наиболее уместно**.

### Задачи
- Анализ **теоретических основ** региональной интеграции в естественных монополиях
- Анализ российских и зарубежных **практик** региональной интеграции в управлении естественными монополиями
- Выработка подхода по **оценке ключевых показателей** работы предприятий при разных масштабах (и оценка)
- Выявление потенциальных **выгод и издержек** при переходе к региональной модели в ВиВ (и систематизация)
- Определение типовых **подходов** по организации управления водоканалами на основе разных факторов

---
# И что мы предполагаем?

1. При управлении предприятиями ВиВ на региональном/межрегиональном уровне удельные **трансформационные** издержки ниже, чем при управлении на местном уровне
2. По мере роста предприятий ВиВ **трансакционные** издержки снижаются до определенного предела, а далее растут для крупнейших компаний
3. Региональные каналы способны активнее инвестировать в развитие или реконструкцию инфраструктуры в малых/уязвимых (очень часто эквивалентно) городах.
4. Региональные / межрегиональные предприятия ВиВ формируют риск возникновения олигополии на национальном уровне.

# Кто нам поможет? Никто. (Прототеоррамка)

# Как мы будем делать? (Протометоды)
Скорее всего, возникнут трудности с массовым сопоставлением показателей деятельности водоканалов до и после регионализации в одних и тех же городах.

Примерно выделяем такие этапы:
1. Формирование **базы данных о деятельности** водоканалов в различных городах. Числовая оценка показателей работы водоканалов для различных **групп наблюдений**. Выявление паттернов, характерных для групп.
2. Выявление показательных примеров регионализации водоканалов, анализ показателей их деятельности **до и после** регионализации.
3. Анализ мировых практик по оптимизации управления и организации предприятий в ВиВ и смежных отраслях. Поиск нехарактерных для отечественной практики **моделей** управления.
4. **Интервью** с представителями отраслевых предприятий. Какие издержки наиболее заметны в практике? Какие возможности их минимизации? Как это зависит от масштаба предприятия, какие эффекты можно наблюдать?
